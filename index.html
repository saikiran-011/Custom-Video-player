<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Video Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body class="full-view">
    <div class="navbar">

    </div>

    <div class="video-container">
        <img id="thumbnail-image" src="/assets/666310fc647d79dc96fd21a3.jpg">


        <video id="video">
            <source src="/assets/How I Make My Thumbnails in 5 Minutes _ Canva Tutorial.mp4">
        </video>


        <div class="controls">
            <div class="control-buttons">
                <button id="skipminus-10">
                    <i class="fa-solid fa-backward"></i>
                </button>
                <button id="play-pause">
                    <i class="fa-solid fa-backward"></i>
                </button>
                <button id="skip-10">
                    <i class="fa-solid fa-backward"></i>
                </button>
            </div>

            <div class="video-timer">
                <span id="current-time">00:00</span>
                <span id="separator"></span>
                <span id="max-duration">00:00</span>
            </div>

            <div class="playback-line">
                <div class="progress-bar"></div>
            </div>

            <div class="right">
                <div class="volume-container">
                    <div id="mute">
                        <i class="fas fa-volume-up"></i>                      
                    </div>

                    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
                </div>

                <div class="fullscreen-btn">
                    <i class="fa-solid fa-expand"></i>

                </div>
            </div>
        </div>
  </div>

  <div class="suggestions">

  </div>

  <div class="comments">

  </div>
</body>
</html>
